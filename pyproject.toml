[project]
name = "baglens"
version = "0.2.0"
description = "An MCP server that lets an agent investigate a fleet of robot logs — indexed, comparative, budget-aware, and citing its evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["mcp", "ros", "ros2", "rosbag", "mcap", "robotics", "llm", "agent"]
dependencies = [
    "duckdb>=1.5.5",
    "mcap>=1.4.0",
    "mcap-ros2-support>=0.5.7",
    "mcp>=2.0.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rosbags>=0.11.4",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
# PX4 flight logs. Kept optional so the core install stays small and ROS-free.
ulog = ["pyulog>=1.2.0"]

[project.scripts]
baglens = "baglens.server:main"

[project.urls]
Homepage = "https://github.com/yourname/baglens"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.5",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
