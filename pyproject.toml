[project]
name = "baglens"
version = "0.3.0"
description = "Robot recording integrity auditing with published precision and recall — and an `unassessable` verdict when it cannot tell. MCP server, fleet catalog, training-data gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["mcp", "ros", "ros2", "rosbag", "mcap", "robotics", "llm", "agent"]
dependencies = [
    "duckdb>=1.5.5",
    "mcap>=1.4.0",
    "mcap-ros2-support>=0.5.7",
    "mcp>=2.0.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rosbags>=0.11.4",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
# PX4 flight logs. Kept optional so the core install stays small and ROS-free.
ulog = ["pyulog>=1.2.0"]
# Model-in-the-loop evals (`python -m evals.runner --model`). Optional because the
# deterministic eval path — the one CI runs — must never need an API key or a network.
evals = ["anthropic>=0.40.0"]

[project.scripts]
baglens = "baglens.server:main"

[project.urls]
Homepage = "https://github.com/ahmedsleem109/Baglens"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.5",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/baglens"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true
# strict, minus the two that would only add noise: the MCP decorator surface is
# untyped upstream, and Pydantic models carry their own runtime validation
strict = true
disallow_untyped_decorators = false
warn_return_any = false

# `mcap` ships an __init__.py but no py.typed, so mypy tries to analyse the
# installed source and trips over "found twice under different module names".
# Treat the untyped third-party readers as opaque; our wrappers are typed.
[[tool.mypy.overrides]]
module = ["mcap.*", "mcap_ros2.*", "rosbags.*", "pyulog.*", "plotly.*", "duckdb.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
